[pytest]
testpaths = tests
pythonpath = .
# GUI tests (tests/ui) use pytest-qt with PySide6; they are skipped
# automatically when PySide6/pytest-qt are not installed.
qt_api = pyside6
# A hung test (e.g. a modal dialog nobody answered) must not hang CI forever.
# "thread" works even when the main thread is blocked inside a Qt event loop,
# where the default "signal" method can never fire. Needs pytest-timeout.
timeout = 300
timeout_method = thread
markers =
    slow: long-running test
