name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows is the primary desktop platform for AlphaDEX users, but the
    # suite was developed on Linux; treat Windows as informational until it
    # has been green for a while.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: System libraries (Qt offscreen + ffmpeg)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 ffmpeg

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q -rfE --timeout 300

      - name: GUI snapshots (visual baseline artifact)
        if: always() && runner.os == 'Linux' && matrix.python == '3.13'
        run: python scripts/gui_snapshots.py --out snapshots --themes midnight,pearl

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux' && matrix.python == '3.13'
        with:
          name: gui-snapshots
          path: snapshots
          retention-days: 14
